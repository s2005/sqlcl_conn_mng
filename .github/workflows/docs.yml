name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - ".markdownlint.json"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - ".markdownlint.json"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rules and ignores come from .markdownlint-cli2.jsonc at the repository root.
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
