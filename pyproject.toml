[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlcl-conn-mng"
version = "0.4.0"
description = "Inspect and manage Oracle SQLcl saved connections"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "s2005", email = "s2005@users.noreply.github.com" },
]
keywords = ["oracle", "sqlcl", "connections"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
sqlcl-conn-mng = "sqlcl_conn_mng.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlcl_conn_mng"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["sqlcl_conn_mng"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not integration",
]
markers = [
    "unit: Unit tests with no external dependencies",
    "integration: Integration tests requiring external services",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sqlcl_conn_mng"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
